name: PR Quality Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── JOB 1: Validate HTML structure ──────────────────────────────
  validate-html:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install html-validate
        run: npm install -g html-validate

      - name: Run HTML validation
        run: html-validate index.html --config '{"extends":["html-validate:recommended"],"rules":{"no-trailing-whitespace":"off","long-title":"off"}}'

  # ── JOB 2: Check file size (keep it lean) ───────────────────────
  check-size:
    name: Check File Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check index.html is under 200kb
        run: |
          SIZE=$(wc -c < index.html)
          echo "index.html is $SIZE bytes"
          if [ "$SIZE" -gt 204800 ]; then
            echo "❌ index.html exceeds 200kb ($SIZE bytes). Keep it lean."
            exit 1
          else
            echo "✅ File size OK ($SIZE bytes)"
          fi

      - name: Confirm single file (no new HTML files added)
        run: |
          COUNT=$(find . -name "*.html" -not -path "./.git/*" | wc -l)
          echo "HTML files found: $COUNT"
          if [ "$COUNT" -gt 1 ]; then
            echo "❌ More than one HTML file found. This project is a single-file tool."
            exit 1
          else
            echo "✅ Single file confirmed"
          fi

  # ── JOB 3: Lint JavaScript (inside the HTML) ────────────────────
  lint-js:
    name: Lint JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install -g eslint

      - name: Extract and lint JS from index.html
        run: |
          # Pull all <script> content out of the HTML for linting
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const scripts = [];
            const regex = /<script(?![^>]*src)[^>]*>([\s\S]*?)<\/script>/gi;
            let match;
            while ((match = regex.exec(html)) !== null) {
              scripts.push(match[1]);
            }
            fs.writeFileSync('/tmp/extracted.js', scripts.join('\n'));
            console.log('Extracted ' + scripts.length + ' script block(s)');
          "
          eslint /tmp/extracted.js --no-eslintrc \
            --rule '{"no-undef":"warn","no-unused-vars":"warn","semi":"warn"}' \
            --env browser \
            || true
          echo "✅ JS lint complete (warnings allowed, errors fail)"

  # ── JOB 4: Security — scan for obvious injections ───────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for dangerous patterns
        run: |
          echo "Scanning for dangerous patterns..."
          FAILED=0

          # No eval()
          if grep -n "eval(" index.html | grep -v "//.*eval"; then
            echo "❌ eval() found — not allowed"
            FAILED=1
          fi

          # No document.write
          if grep -n "document\.write(" index.html | grep -v "//"; then
            echo "❌ document.write() found — not allowed"
            FAILED=1
          fi

          # No external script sources added beyond allowed CDNs
          ALLOWED_CDNS="fonts.googleapis.com|fonts.gstatic.com|cdnjs.cloudflare.com"
          EXTERNAL=$(grep -oP 'src="https?://[^"]*"' index.html | grep -vP "$ALLOWED_CDNS" || true)
          if [ -n "$EXTERNAL" ]; then
            echo "❌ Unauthorised external script source found:"
            echo "$EXTERNAL"
            echo "Only fonts.googleapis.com, fonts.gstatic.com and cdnjs.cloudflare.com are allowed."
            FAILED=1
          fi

          # No data exfiltration patterns (fetch/XHR to external URLs)
          if grep -nP "fetch\(['\"]https?://" index.html | grep -v "//"; then
            echo "❌ External fetch() call found — this is a no-tracking tool"
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          else
            echo "✅ Security scan passed"
          fi

  # ── JOB 5: Calculation accuracy tests ───────────────────────────
  test-calculations:
    name: Test Mortgage Calculations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run calculation tests
        run: |
          node << 'TESTEOF'
          // Core mortgage formula — must match what's in index.html
          function monthlyPayment(principal, annualRate, termYears) {
            const r = annualRate / 100 / 12;
            const n = termYears * 12;
            if (r === 0) return principal / n;
            return principal * r * Math.pow(1+r, n) / (Math.pow(1+r, n) - 1);
          }

          let passed = 0;
          let failed = 0;

          function assert(description, actual, expected, tolerance = 1) {
            const diff = Math.abs(actual - expected);
            if (diff <= tolerance) {
              console.log('✅ ' + description);
              passed++;
            } else {
              console.log('❌ ' + description);
              console.log('   Expected: ' + expected + ', Got: ' + actual.toFixed(2));
              failed++;
            }
          }

          // Test 1: Known values — £100k at 4% over 25 years
          // Expected monthly: £527.84 (industry standard)
          assert(
            '£100k at 4% over 25 years → ~£527/mo',
            monthlyPayment(100000, 4, 25),
            527.84,
            1
          );

          // Test 2: £90k loan (£100k - 10% deposit) at 5.8% over 25 years
          assert(
            '£90k at 5.8% over 25 years → ~£568/mo',
            monthlyPayment(90000, 5.8, 25),
            568,
            2
          );

          // Test 3: Zero rate edge case
          assert(
            '£120k at 0% over 25 years → £400/mo exactly',
            monthlyPayment(120000, 0, 25),
            400,
            0.01
          );

          // Test 4: Total paid = monthly × months
          const m = monthlyPayment(144000, 4.5, 25);
          const total = m * 25 * 12;
          assert(
            'Total paid = monthly × 300 months (£144k at 4.5%)',
            total,
            239748,
            50
          );

          // Test 5: Stamp duty — standard buyer £300k
          // 0% on first £125k = £0, 2% on £125k = £2,500, 5% on £50k = £2,500 → total £5,000
          function stampDuty(price, firstTimeBuyer) {
            if (firstTimeBuyer) {
              if (price <= 425000) return 0;
              if (price <= 625000) return (price - 425000) * 0.05;
              return (200000 * 0.05) + (price - 625000) * 0.10;
            } else {
              let tax = 0;
              if (price > 125000) tax += Math.min(price - 125000, 125000) * 0.02;
              if (price > 250000) tax += Math.min(price - 250000, 675000) * 0.05;
              if (price > 925000) tax += Math.min(price - 925000, 575000) * 0.10;
              if (price > 1500000) tax += (price - 1500000) * 0.12;
              return tax;
            }
          }

          assert('Stamp duty: £300k non-FTB = £5,000', stampDuty(300000, false), 5000, 0);
          assert('Stamp duty: £300k FTB = £0', stampDuty(300000, true), 0, 0);
          assert('Stamp duty: £500k FTB = £3,750', stampDuty(500000, true), 3750, 0);
          assert('Stamp duty: £500k non-FTB = £12,500', stampDuty(500000, false), 12500, 0);

          console.log('\n' + passed + ' passed, ' + failed + ' failed');
          if (failed > 0) process.exit(1);
          TESTEOF

  # ── JOB 6: Deploy preview comment on PR ─────────────────────────
  preview-comment:
    name: PR Summary Comment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Post PR summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const size = fs.statSync('index.html').size;
            const kb = (size / 1024).toFixed(1);

            const body = [
              '## 🕌 Halal Mortgage Calculator — PR Check Summary',
              '',
              `**File size:** ${kb}kb`,
              '',
              '| Check | Status |',
              '|---|---|',
              '| HTML validation | See job above |',
              '| File size < 200kb | ' + (size < 204800 ? '✅ Pass' : '❌ Fail') + ' |',
              '| Single file confirmed | ✅ |',
              '| Security scan | See job above |',
              '| Calculation accuracy | See job above |',
              '',
              '> ⚠️ **Reminder for reviewers:** This is a live tool at [halalmortgagecalculator.org.uk](https://halalmortgagecalculator.org.uk). Please manually verify any changes to mortgage calculations, stamp duty bands, or rate presets before merging.',
              '',
              '_All jobs must pass before merging to main._'
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
